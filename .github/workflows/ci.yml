name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Contrast first: it is the cheapest check and the one this package
      # exists to enforce. A failing pair should stop the build before
      # anything else runs.
      - name: Verify contrast of every shipped colour pair
        run: node scripts/check-contrast.mjs

      # npm test, not raw `node --test`: Node's runner treats every file under
      # test/ as a spec, which would pull in the browser suite and fail without
      # a browser. The package script scopes it to the unit specs.
      - name: Test
        run: npm test

      - name: Build the bundle and the icons
        run: npm run build

      - name: Fail if the committed bundle or icons are stale
        run: git diff --exit-code dist/ assets/icons/

  # Browser gate. The `verify` job above is deliberately dependency-free, so it
  # cannot run the one check that matters most for this package: that toggling
  # an axis actually MOVES rendered content. Three axes once shipped inert with
  # every attribute set correctly — attribute assertions would have passed them.
  # This job installs a browser and asserts an observable computed-style change
  # for every axis/value on both brands (plus reflow + the radiogroup keyboard
  # contract), and runs an axe-core scan of the panel.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Playwright is intentionally NOT a package dependency (keeps the default
      # install lean). --no-save so it never touches the committed manifest.
      - name: Install Playwright + Chromium
        run: npm i --no-save playwright && npx playwright install --with-deps chromium

      - name: Assert every axis moves rendered content
        run: npm run test:browser

      - name: axe-core scan of the panel
        run: npm run test:axe
